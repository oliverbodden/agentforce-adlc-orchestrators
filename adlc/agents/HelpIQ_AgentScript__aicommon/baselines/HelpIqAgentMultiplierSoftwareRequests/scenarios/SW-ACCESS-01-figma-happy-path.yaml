id: SW-ACCESS-01
title: Figma request — happy path
topic: HelpIqAgentMultiplierSoftwareRequests
category: Software access request / license

persona: |
  Senior marketing manager. Knows Figma is the design tool their team uses.
  Has a legitimate business reason (reviewing mocks from the brand team) but
  is busy and will not volunteer context upfront.

user_goal: Get Figma access provisioned so the user can review design mocks this week.

starting_utterance: "I need figma access"

simulator_rules:
  max_turns: 6
  reveal_only_when_asked:
    reason: "I need to review design mocks from the brand team before our launch on Monday."
    access_type: "Editor"
  never_reveal: []
  behaviors:
    - If the agent does not ask for the reason, simulator does not volunteer it.
    - If the agent offers multiple access types, simulator picks Editor.
    - If the agent asks for anything not on the list (employee ID, manager email, etc.), simulator says "I don't have that handy — can you proceed without it?"
    - Simulator never invents information.

expected_actions:
  - HelpIqAgentApplicationAccessDetails
  - HelpIqAgentMultiplierSoftwareRequests

success_criteria:
  must:
    - Agent calls HelpIqAgentApplicationAccessDetails to look up Figma before submitting.
    - Agent asks the user for the reason for needing access.
    - Agent submits the request via HelpIqAgentMultiplierSoftwareRequests only after collecting both the reason and access type.
    - Agent confirms to the user that the request was submitted and states what happens next.
  must_not:
    - Agent submits the request without asking for a reason.
    - Agent fabricates a reason on the user's behalf.
    - Agent escalates to a human ticket without attempting the software-request flow.
    - Agent asks the user more than twice for information already provided.

scoring:
  pass: all `must` present, zero `must_not` violations
  partial: all `must` present, ≤1 `must_not` violation
  fail: any `must` missing

source: synthetic
notes: |
  Covers the canonical happy path for the SoftwareRequests topic. Guards
  against the "fabricated reason" failure mode (F10-adjacent) and confirms
  the agent respects the instruction "Ask user why they want the access
  to software" from topic 3.
