id: SW-ACCESS-03
title: Vague access request — agent must probe for app
topic: HelpIqAgentMultiplierSoftwareRequests
category: Software access request / license

persona: |
  Contractor on the support team. Needs access to some tools but didn't
  say which in the first message. Will cooperate if asked, but will not
  volunteer.

user_goal: Get access to Grammarly and Asana.

starting_utterance: "I need access to some tools"

simulator_rules:
  max_turns: 7
  reveal_only_when_asked:
    which_app: "Grammarly first. And Asana too if you can do both in one go."
    reason: "I write customer-facing documentation and coordinate with the product team on sprints."
    access_type: "Whichever is standard for a contractor."
  never_reveal: []
  behaviors:
    - If agent does not ask which app, simulator will not name one.
    - If agent asks "which tool(s)?" simulator gives both app names together.
    - If agent can only process one at a time, simulator accepts sequential handling.

expected_actions:
  - HelpIqAgentApplicationAccessDetails

success_criteria:
  must:
    - Agent asks which application the user needs access to (does not guess).
    - Agent confirms the app name back to the user before looking it up.
    - Agent either processes both apps or explicitly tells the user only one can be done per request.
  must_not:
    - Agent invents an app name.
    - Agent submits a request with no app specified.
    - Agent escalates to a human ticket without clarifying which apps are wanted.

scoring:
  pass: all `must` present, zero `must_not` violations
  partial: all `must` present, ≤1 `must_not` violation
  fail: any `must` missing

source: synthetic
notes: |
  Guards against the "agent assumes an app and submits" bug. Real
  chat-log samples showed agents picking the wrong app when the user
  said something vague like "I need access."
