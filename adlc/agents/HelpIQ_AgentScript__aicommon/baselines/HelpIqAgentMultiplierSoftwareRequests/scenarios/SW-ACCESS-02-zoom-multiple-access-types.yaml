id: SW-ACCESS-02
title: Zoom request — multiple access types
topic: HelpIqAgentMultiplierSoftwareRequests
category: Software access request / license

persona: |
  New hire, first week. Knows they need Zoom because their team has all
  meetings there, but doesn't know which Zoom license tier they need.

user_goal: Get a Zoom license that works for hosting team standups.

starting_utterance: "can I get zoom set up please"

simulator_rules:
  max_turns: 7
  reveal_only_when_asked:
    reason: "I'm new on the data team and I host our daily standup and a weekly demo — need to be able to host, not just join."
    access_type: "Hosting the standup sounds like I need the licensed/pro one — go with that."
  never_reveal: []
  behaviors:
    - If agent offers multiple Zoom access types (Basic, Licensed, Pro, Webinar, etc.), simulator picks the one that supports hosting.
    - If agent only offers one, simulator accepts it but the scenario should be marked partial because the agent didn't surface the choice.
    - Simulator will gently push back if the agent picks an access type without asking ("wait, which one does that give me?").

expected_actions:
  - HelpIqAgentApplicationAccessDetails
  - HelpIqAgentMultiplierSoftwareRequests

success_criteria:
  must:
    - Agent calls HelpIqAgentApplicationAccessDetails for Zoom.
    - Agent presents the user with a choice of access types (not a single default).
    - Agent asks for the reason for access.
    - Agent submits the request with the user's chosen access type, not a guess.
  must_not:
    - Agent picks an access type without offering choices when multiple exist.
    - Agent submits before the user confirms the access type.
    - Agent invents an access type not returned by the lookup action.

scoring:
  pass: all `must` present, zero `must_not` violations
  partial: all `must` present, ≤1 `must_not` violation
  fail: any `must` missing

source: synthetic
notes: |
  Directly tests the instruction "If application has more than one access
  types, offer user to which one best suits them" from topic 3. This is
  the scenario that the F10 Zoom Phone confirmation-loop bug in the
  single-turn eval partially pointed at.
